{% extends "base.html" %}

{% block content %}
  <ul>
    {% for driver in driver_list %}
      <li><a href="{% url 'taxi:driver-detail' driver.id%}">Username: </a>{{ driver.username }}</li>
      <li>{{ driver.first_name }}</li>
      <li>{{ driver.last_name }}</li>
    {% endfor %}
  </ul>
{% endblock %}
